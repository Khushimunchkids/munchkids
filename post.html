<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Munchkids Preschool WhatsApp Channel</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#ffe8f3,#fff6d6);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      background:#ffffff;
      width:350px;
      border-radius:25px;
      padding:30px 25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.15);
    }

    /* UPDATED LOGO STYLE */
    .logo{
      width:120px;
      height:120px;
      object-fit:contain;
      margin-bottom:20px;
    }

    h1{
      color:#ff4f8b;
      font-size:28px;
      margin-bottom:10px;
    }

    p{
      color:#555;
      font-size:16px;
      line-height:1.6;
      margin-bottom:25px;
    }

    .join-btn{
      display:inline-block;
      text-decoration:none;
      background:#25D366;
      color:white;
      padding:14px 28px;
      border-radius:50px;
      font-size:18px;
      font-weight:bold;
      transition:0.3s;
      box-shadow:0 6px 15px rgba(37,211,102,0.4);
    }

    .join-btn:hover{
      background:#1ebe5d;
      transform:scale(1.05);
    }

    .emoji{
      font-size:24px;
    }

  </style>
</head>

<body>

  <div class="card">

    <!-- YOUR LOGO -->
    <img 
      src="FINAL LOGO.png" 
      class="logo" 
      alt="Munchkids Preschool Logo"
    >

    

    <p>
      Join our official WhatsApp Channel for
      <b>admission updates, activities, events, learning tips & fun moments!</b>
    </p>
    <a 
      href="https://whatsapp.com/channel/0029VbCxkph5fM5dap2QBg0T"
      target="_blank"
      class="join-btn"
    >
      📲 Follow Our Channel
    </a>

    <p style="margin-top:20px;">
      ✨ Choose smart , Be smart ✨
    </p>

  </div>

</body>
</html>
